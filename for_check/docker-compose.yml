services:
  postgres:
    image: postgres:latest
    container_name: practice-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg-data:/var/lib/pgsql/data
      - ./init-scripts/:/docker-entrypoint-initdb.d
    ports:
      - '${PG_PORT}:5432'

volumes:
  pg-data:
