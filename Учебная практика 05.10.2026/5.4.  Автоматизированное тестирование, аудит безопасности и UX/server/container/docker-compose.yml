services:
  db:
    image: postgres:latest
    container_name: practice5-db
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg5-data:/var/lib/psql/data
      - ./:/docker-entrypoint-initdb.d
    ports:
      - '${PG_PORT}:5432'

volumes:
  pg5-data:
